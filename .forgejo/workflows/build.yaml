on:
  push:
    branches:
      - main
env:
  IMAGE: ghcr.io/devfaz/firefly-iii-dkb
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: docker
    container:
      image: git.rfc2324.de/rfc2324/base-image:latest
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - name: Prepare
        run: |-
          export DEBIAN_FRONTEND=noninteractive
          set -e -o pipefail -u
          echo ${{ secrets.MY_GITHUB_TOKEN }} | docker login --username devfaz --password-stdin $REGISTRY
          docker build -q -t ${IMAGE}:latest docker/
      - name: Setup Node.js
        uses: https://data.forgejo.org/actions/setup-node@v7
        with:
          node-version: "lts/*"          
      - name: Release
        run: |-
          npm install @semantic-release/exec -D
          npx semantic-release
